name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm rebuild better-sqlite3-multiple-ciphers
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
